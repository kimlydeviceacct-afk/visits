name: visits

services:

  # ----------------------------------------------------------
  # Public entrypoint: nginx reverse proxy -> app
  # ----------------------------------------------------------
  nginx:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    restart: unless-stopped
    ports:
      - "4001:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend-network

  # ----------------------------------------------------------
  # Node application (not published to the host)
  # ----------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: mycompany/visits:1.0.0
    restart: unless-stopped
    init: true                    # proper signal handling / zombie reaping
    environment:
      NODE_ENV: production
      PORT: "8081"
      REDIS_HOST: redis-service   # must match the redis service name below
      REDIS_PORT: "6379"
    # Defined here (not only in the Dockerfile) so nginx's
    # "depends_on: service_healthy" always works.
    # TCP check on purpose: hitting "/" would increment the visit counter.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('net').connect(8081,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      redis-service:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend-network
      - backend-network

  # ----------------------------------------------------------
  # Redis (only reachable from the app)
  # ----------------------------------------------------------
  redis-service:
    image: redis:7-alpine
    # Run directly as the redis user so we can drop ALL capabilities
    user: redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend-network

volumes:
  redis-data:

networks:
  frontend-network:
    driver: bridge
  # internal: no route to the outside world or the host
  backend-network:
    driver: bridge
    internal: true